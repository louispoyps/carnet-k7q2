name: Bot Leboncoin

on:
  schedule:
    # Toutes les 10 min, 24h/24 (dépôt public : minutes illimitées).
    # GitHub peut décaler un passage de quelques minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  chasse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recherche des bonnes affaires
        run: python bot.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Leboncoin bloque les serveurs de GitHub : on passe par le proxy résidentiel
          PROXY_URL: ${{ secrets.PROXY_URL }}

      # Mémorise les annonces déjà envoyées pour ne pas les renvoyer
      - name: Sauvegarde des annonces vues
        if: always()
        run: |
          git config user.name "bot-leboncoin"
          git config user.email "bot-leboncoin@users.noreply.github.com"
          git add -f annonces_vues.json 2>/dev/null || exit 0
          git commit -m "maj annonces vues" || exit 0
          git pull --rebase -X theirs && git push

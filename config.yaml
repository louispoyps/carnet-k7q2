# ============================================================
#  Bot achat-revente Leboncoin -> Telegram
# ============================================================

# Sur ton PC, le token et le chat_id sont dans secret.yaml (jamais envoyé sur GitHub).
# Sur GitHub, ils sont dans les secrets du dépôt.
telegram:
  # Token donné par @BotFather (voir LISEZMOI.md)
  token: "COLLE_TON_TOKEN_ICI"
  # Ton chat_id (lance : python bot.py --chat-id  pour le trouver)
  chat_id: ""

# Temps entre deux passages (minutes). Trop bas = risque de blocage Leboncoin.
intervalle_minutes: 10

# Heure d'envoi du rapport quotidien des prix du marché (0-23). Mets null pour le couper.
rapport_marche_heure: 8

# Départements où chercher, ex : ["13", "83", "84"]. Vide = toute la France.
departements: ["13", "84", "83", "30", "04"]

# ------------------------------------------------------------
#  Calcul de rentabilité
#  achat max = revente estimée x (1 - négo) - frais - marge min
#  (= ta règle "prix moyen - 1 300 €" environ)
# ------------------------------------------------------------
rentabilite:
  negociation_revente_pct: 8    # ce que tu lâches à la revente
  frais_fixes: 500              # CT, nettoyage, trajet, imprévus
  marge_min: 500                # bénéfice minimum pour être alerté
  # Prudent : revente = le plus bas entre le marché en direct et le milieu de ta grille
  prudent: true
  # Si true : jamais au-dessus de l'"achat_max" de ta grille, même si le marché est plus haut
  respecter_grille: true
  # Le bot cherche aussi les annonces jusqu'à X % au-dessus de l'achat max,
  # parce qu'elles peuvent se négocier (il te dit à combien proposer)
  marge_negociation_achat_pct: 12
  # Prix sous X % du marché = suspect (arnaque ou gros défaut caché)
  prix_suspect_pct: 50

# Frais ajoutés si la description contient ces mots
frais_travaux:
  "réparations mineures": 400   # case "état" de l'annonce
  "à prévoir": 400
  "a prevoir": 400
  "embrayage": 500
  "voyant": 300
  "contrôle technique à faire": 150
  "ct à faire": 150
  "pneus à changer": 250
  "clim à recharger": 100

# Points positifs repérés dans la description
mots_positifs:
  - "distribution faite"
  - "courroie faite"
  - "ct ok"
  - "contrôle technique ok"
  - "ct vierge"
  - "carnet d'entretien"
  - "factures"
  - "première main"
  - "1ère main"
  - "embrayage neuf"

# Annonce ignorée si la description contient un de ces mots
mots_interdits:
  - "hs"
  - "moteur hs"
  - "boite hs"
  - "boîte hs"
  - "pour pièces"
  - "pour pieces"
  - "ne démarre pas"
  - "ne demarre pas"
  - "joint de culasse"
  - "épave"
  - "accidenté"
  - "sans carte grise"
  - "export"
  - "vendu en l'état pour"

# Historique (rapport Autoviza joint par Leboncoin)
historique:
  exiger_rapport: false
  proprietaires_max: 5
  rejeter_si_sinistre: true
  rejeter_si_km_incoherent: true
  rejeter_si_vehicule_endommage: true
  rejeter_si_usage_pro: true      # taxi/VTC, auto-école... dur à revendre

# ------------------------------------------------------------
#  Ta grille de modèles
#  carburant : essence / diesel / hybride (ou supprime la ligne)
#  marque / modele : codes Leboncoin (déjà vérifiés)
#  titre_contient / titre_exclut : écarte les annonces mal classées
#  (ex : une Twingo rangée en "Clio" par le vendeur)

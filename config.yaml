# ============================================================
#  Bot achat-revente consoles Leboncoin -> Telegram
# ============================================================

# Sur ton PC, le token et le chat_id sont dans secret.yaml (jamais envoyé sur GitHub).
# Sur Render, ils sont dans les variables d'environnement.
telegram:
  token: "COLLE_TON_TOKEN_ICI"
  chat_id: ""

# Temps entre deux passages (minutes). Les consoles partent vite : 5 à 10 min.
intervalle_minutes: 10

# Heure d'envoi du rapport quotidien des prix du marché (0-23). Mets null pour le couper.
rapport_marche_heure: 8

# ------------------------------------------------------------
#  Calcul de rentabilité
#  bénéfice = revente x (1 - négo) - prix d'achat - frais d'achat - réparations
# ------------------------------------------------------------
rentabilite:
  negociation_revente_pct: 5    # ce que tu lâches à la revente
  # Frais quand tu achètes avec la livraison Leboncoin (estimation, ajuste si besoin) :
  frais_achat_fixe: 10          # port Mondial Relay / Colissimo + part fixe des frais de service
  frais_achat_pct: 4            # part des frais de protection proportionnelle au prix
  marge_min: 30                 # bénéfice minimum pour être alerté (en €)...
  marge_min_pct: 15             # ...ou ce % du prix de revente, si c'est plus (65 € sur une console à 450 €)
  # Revente estimée = prix de vente rapide (25 % des annonces les moins chères).
  # Prudent : le plus bas entre ce prix et le milieu de ta fourchette de revente
  prudent: true
  # Le bot cherche aussi jusqu'à X % au-dessus de ton achat max (annonces à négocier)
  marge_negociation_achat_pct: 10
  # Prix sous X % de la revente = suspect (arnaque ou défaut caché)
  prix_suspect_pct: 55
  # Durée pendant laquelle le prix du marché est réutilisé avant d'être recalculé
  cache_marche_minutes: 120
  # Nombre de pages de 100 annonces lues pour calculer le prix du marché
  pages_marche: 3

# ------------------------------------------------------------
#  Livraison obligatoire
# ------------------------------------------------------------
# Modes d'envoi acceptés (codes Leboncoin). Les annonces "main propre" sont ignorées.
modes_envoi: ["mondial_relay", "colissimo", "distance"]
# Annonce ignorée si la description dit que c'est en main propre seulement
mots_main_propre:
  - "main propre uniquement"
  - "uniquement en main propre"
  - "seulement en main propre"
  - "main propre seulement"
  - "remise en main propre uniquement"
  - "pas d'envoi"
  - "pas d envoi"
  - "aucun envoi"
  - "pas de livraison"
  - "pas d'expédition"
  - "n'envoie pas"
  - "envoi impossible"

# ------------------------------------------------------------
#  Consoles qui ne marchent peut-être pas
# ------------------------------------------------------------
# L'annonce est quand même envoyée, avec un avertissement 🚨 si le titre ou la
# description contient un de ces mots (sauf s'il est nié : "ne surchauffe pas").
# Les annonces marquées "Pour pièces" par le vendeur (ou "pour pièces" dans le titre) restent ignorées.
mots_a_verifier:
  - "hs"
  - "ne marche pas"
  - "ne marche plus"
  - "ne fonctionne pas"
  - "ne fonctionne plus"
  - "en panne"
  - "pour pièces"
  - "pour pieces"
  - "ne s'allume pas"
  - "ne s'allume plus"
  - "ne s allume pas"
  - "s'éteint toute seule"
  - "écran cassé"
  - "ecran cassé"
  - "ecran casse"
  - "écran fissuré"
  - "fissure"
  - "bannie"
  - "banni"
  - "lecteur hs"
  - "ne lit pas"
  - "ne lit plus"
  - "carte mère"
  - "surchauffe"
  - "écran noir"
  - "ecran noir"
  - "à réparer"
  - "a reparer"
  - "boîte vide"
  - "boite vide"
  - "sans la console"
  # Consoles piratées : risque de bannissement, dures à revendre
  - "hekate"
  - "pucée"
  - "pucee"
  - "flashée"
  - "cfw"
  - "atmosphere"

# Annonce ignorée si le titre contient un de ces mots (annonces "je cherche", échanges...)
titre_exclut:
  - "recherche"
  - "cherche"
  - "chercher"
  - "cherches"
  - "recherché"
  - "achète"
  - "achete"
  - "échange uniquement"
  - "echange uniquement"
  - "portable"            # PS Portal / "PlayStation portable"

# Annonce ignorée si le titre COMMENCE par un de ces mots : accessoires rangés en "console"
# (les lots "PS5 + 2 jeux" restent acceptés)
titre_debut_exclut:
  ["manette", "manettes", "jeu", "jeux", "façade", "façades", "facade", "facades", "coque",
   "housse", "étui", "etui", "boîte", "boite", "carton", "support", "station", "dock",
   "chargeur", "câble", "cable", "casque", "volant", "joy-con", "joycon", "lecteur", "skin",
   "stickers", "carte"]

# Accessoire vendu seul : le mot apparaît AVANT tout "+" / "avec" dans le titre
# ("PS5 - Manette Scuff" rejetée, "PS5 + manette" acceptée)
mots_accessoires:
  ["manette", "manettes", "controller", "façade", "façades", "facade", "facades", "split pad",
   "grip", "pochette", "housse", "étui", "etui", "coque", "jeu", "jeux", "joy-con", "joycon",
   "volant", "casque", "station de charge", "arcade", "fight stick", "panthera",
   "storage", "expansion", "carte d'extension", "carte d extension", "kinect", "headset"]

# Consoles rangées par erreur dans « Jeux vidéo » : le début du titre (avant « + » / « avec »)
# ne doit contenir QUE ces mots, sinon c'est un jeu, un collector, une manette...
mots_titre_console:
  [console, consoles, nintendo, switch, oled, ps5, playstation, sony, slim, standard, digital,
   digitale, numérique, numerique, édition, edition, lecteur, disque, disc, cd, blu, ray, avec,
   xbox, series, serie, série, séries, x, s, v1, v2, go, to, tb, 1to, 2to, 825go, 512go, 64go, 32go,
   blanc, blanche, noir, noire, gris, grise, rouge, bleu, bleue, néon, neon, white, black,
   neuf, neuve, neufs, comme, très, tres, bon, bonne, bel, état, etat, parfait, excellent,
   impeccable, nickel, quasi, peu, servi, servie, utilisée, utilisee, occasion, garantie,
   sous, complète, complete, complet, en, boîte, boite, carton, origine, d'origine, pack,
   bundle, vends, vend, vente, à, a, de, du, la, le, les, une, un, et, pour, cause,
   double, emploi, urgent, prix, négociable, negociable, the, model, modèle, modele, version]

# Réparations ajoutées aux frais si la description contient ces mots
frais_reparation:
  "drift": 25
  "joycon défectueux": 25
  "joy-con défectueux": 25
  "manette défectueuse": 30
  "sans manette": 50
  "sans joycon": 60
  "sans joy-con": 60
  "sans dock": 40
  "sans chargeur": 15
  "sans câble": 10
  "sans cable": 10
  "juste la tablette": 90
  "tablette seule": 90
  "console seule": 60
  "rails": 15
  "sans accessoires": 60

# Points positifs repérés dans la description
mots_positifs:
  - "facture"
  - "garantie"
  - "boîte d'origine"
  - "boite d'origine"
  - "complète"
  - "complete"
  - "jamais ouverte"
  - "sous blister"
  - "très peu servi"
  - "comme neuve"

# ------------------------------------------------------------
#  Tes consoles
#  modeles : codes Leboncoin (déjà vérifiés)
#  achat   : ta fourchette d'achat (bas = affaire en or, haut = achat max)
#  revente : ta fourchette de revente
# ------------------------------------------------------------
produits:
  - nom: "PS5"
    mot_cle: "ps5"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    modeles: ["ps5", "ps5slim"]
    titre_exclut: ["ps5 pro", "portal", "psportal", "playstation portal", "ps vr", "psvr"]
    prix_min: 150     # en dessous, ce n'est jamais une PS5 qui marche
    poids_min_g: 1500 # poids estimé par le vendeur, souvent faux (2 kg pour une PS5) ; manettes < 1 kg
    achat: [200, 230]
    revente: [280, 350]

  - nom: "Switch OLED"
    mot_cle: "switch oled"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    modeles: ["switcholed"]
    titre_exclut: ["switch 2", "switch2", "lite"]
    prix_min: 90
    achat: [150, 200]
    revente: [240, 290]

  - nom: "Switch classique"
    mot_cle: "switch"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    modeles: ["switch"]
    titre_exclut: ["oled", "lite", "switch 2", "switch2"]
    prix_min: 40
    achat: [60, 90]
    revente: [100, 140]

  # Prix proposés d'après le marché du 29/10 (25 % les moins chères ≤ 390 €, médiane 480 €)
  - nom: "Switch 2"
    mot_cle: "switch 2"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    modeles: ["switch2"]
    titre_exclut: ["switch 1", "oled", "lite"]
    prix_min: 200
    achat: [300, 340]
    revente: [380, 450]

  # Prix proposés d'après le marché du 30/10 (25 % les moins chères ≤ 450 €, médiane 525 €)
  - nom: "Xbox Series X"
    mot_cle: "series x"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    modeles: ["xboxseriesx"]
    titre_exclut: ["series s", "série s", "serie s", "xbox one", "one x", "one s"]
    prix_min: 200
    poids_min_g: 1500 # poids estimé par le vendeur, souvent faux ; manettes < 1 kg
    achat: [330, 380]
    revente: [430, 520]

  # Prix proposés d'après le marché du 30/10 (25 % les moins chères ≤ 220 €, médiane 255 €)
  - nom: "Xbox Series S"
    mot_cle: "series s"   # recherche aussi ce mot dans la catégorie « Jeux vidéo »
    actif: false      # retirée à ta demande
    modeles: ["xboxseriess"]
    titre_exclut: ["series x", "série x", "serie x", "xbox one", "one x", "one s"]
    prix_min: 80
    achat: [150, 180]
    revente: [210, 260]

  # PS4 classique et Slim. Prix proposés d'après le marché du 30/10 (25 % ≤ 85 €, médiane 115 €)
  - nom: "PS4"
    actif: false      # retirée : marges trop faibles
    modeles: ["ps4", "ps4slim"]
    titre_exclut: ["ps4 pro", "ps5", "ps3", "ps vita"]
    prix_min: 40
    achat: [50, 70]
    revente: [90, 130]

  # PS4 Pro (plus chère). Prix proposés d'après le marché du 30/10 (25 % ≤ 129 €, médiane 150 €)
  - nom: "PS4 Pro"
    actif: false      # en pause : marges trop faibles
    modeles: ["ps4pro"]
    titre_exclut: ["ps5", "ps3"]
    prix_min: 50
    achat: [85, 110]
    revente: [130, 180]
